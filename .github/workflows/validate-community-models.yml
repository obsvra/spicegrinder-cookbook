name: Validate community models

# Runs ModelValidatorApp against every changed model under community-models/, then
# replays each one's own output.csv "# seed=N -- reproduce with: ..." comment line and
# diffs the result against what was actually committed. This proves a submission
# validates and reproduces -- it does NOT prove the model is a sensible representation
# of whatever it claims to simulate. See CONTRIBUTING.md: human review still happens
# after this passes, nothing here auto-merges.

on:
  pull_request:
    paths:
      - "community-models/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # ---------------------------------------------------------------------
      # SpiceGrinder Free comes from a DreamHost cloud-storage bucket whose
      # download links are presigned and re-minted per request -- there's no
      # stable URL to hardcode here. Instead this pulls the Free build from
      # this repo's own GitHub Releases "latest" (a real, permanent API
      # endpoint that always resolves to whatever's currently tagged), so CI
      # never needs updating when a new build ships -- only the release does.
      #
      # CONFIGURE ME, once: publish a GitHub Release on this repo (or set
      # SPICEGRINDER_RELEASE_REPO below to a different owner/repo) with a
      # Linux build attached as an asset. Asset-name matching below assumes
      # something containing "linux", ending in .zip or .tar.gz -- adjust the
      # grep pattern if the real asset name doesn't fit that (unverified,
      # since no release exists yet to check against).
      # ---------------------------------------------------------------------
      - name: Download SpiceGrinder Free (latest GitHub Release)
        env:
          RELEASE_REPO: ${{ vars.SPICEGRINDER_RELEASE_REPO || github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_URL="$(gh api "repos/$RELEASE_REPO/releases/latest" \
            --jq '.assets[] | select(.name | test("linux"; "i")) | select(.name | test("\\.(zip|tar\\.gz)$"; "i")) | .browser_download_url' \
            | head -1)"
          if [ -z "$ASSET_URL" ]; then
            echo "::error::No Linux build asset found on $RELEASE_REPO's latest release. Either no release exists yet, or its asset naming doesn't match this workflow's expectations -- see the CONFIGURE ME comment above this step."
            exit 1
          fi
          echo "Downloading $ASSET_URL"
          ASSET_FILE="$(basename "$ASSET_URL")"
          curl -fsSL "$ASSET_URL" -o "$ASSET_FILE"
          mkdir -p spicegrinder-free
          case "$ASSET_FILE" in
            *.zip) unzip -q "$ASSET_FILE" -d spicegrinder-free ;;
            *.tar.gz) tar -xzf "$ASSET_FILE" -C spicegrinder-free ;;
          esac
          JAR="$(find spicegrinder-free -iname 'spicegrinder-*.jar' ! -iname '*sources*' ! -iname '*javadoc*' | head -1)"
          if [ -z "$JAR" ]; then
            echo "::error::No spicegrinder-*.jar found inside $ASSET_FILE -- the archive layout may not match what this workflow expects (see the CONFIGURE ME comment above)."
            find spicegrinder-free -type f
            exit 1
          fi
          echo "SPICEGRINDER_JAR=$JAR" >> "$GITHUB_ENV"

      - name: Find changed model files
        id: changed
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- community-models | grep -E '\.(xml|json|sgm)$' || true)"
          echo "Changed model files:"
          echo "$CHANGED"
          {
            echo "files<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate and reproduce each changed model
        if: steps.changed.outputs.files != ''
        run: |
          set -euo pipefail
          FAIL=0
          while IFS= read -r MODEL; do
            [ -z "$MODEL" ] && continue
            echo "::group::$MODEL"

            echo "-- ModelValidatorApp --"
            if ! java -cp "$SPICEGRINDER_JAR" com.obsvra.spicegrinder.tools.ModelValidatorApp "$MODEL"; then
              echo "::error file=$MODEL::Failed to validate"
              FAIL=1
              echo "::endgroup::"
              continue
            fi

            MODEL_DIR="$(dirname "$MODEL")"
            OUTPUT_CSV="$MODEL_DIR/output.csv"
            if [ ! -f "$OUTPUT_CSV" ]; then
              echo "::warning file=$MODEL::No sibling output.csv found next to this model -- skipping reproduction check (see CONTRIBUTING.md, every submission needs one)"
              echo "::endgroup::"
              continue
            fi

            HEADER="$(head -1 "$OUTPUT_CSV")"
            SEED="$(echo "$HEADER" | grep -oE 'seed=[^ ]+' | cut -d= -f2)"
            COUNT="$(echo "$HEADER" | grep -oE -- '--count [0-9]+' | awk '{print $2}')"
            if [ -z "$SEED" ] || [ -z "$COUNT" ]; then
              echo "::error file=$OUTPUT_CSV::Could not parse '# seed=N -- reproduce with: grind --seed N --count K <path>' from the first line"
              FAIL=1
              echo "::endgroup::"
              continue
            fi

            echo "-- reproducing with seed=$SEED count=$COUNT --"
            ACTUAL="$(java -cp "$SPICEGRINDER_JAR" com.obsvra.spicegrinder.tools.Grind --seed "$SEED" --count "$COUNT" --header --quiet "$MODEL")"
            EXPECTED="$(tail -n +2 "$OUTPUT_CSV")"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error file=$OUTPUT_CSV::Reproduced output does not match the committed file"
              diff <(echo "$EXPECTED") <(echo "$ACTUAL") || true
              FAIL=1
            else
              echo "Reproduced output matches committed output.csv exactly."
            fi
            echo "::endgroup::"
          done <<< "${{ steps.changed.outputs.files }}"

          exit $FAIL
